name: Release with GoReleaser

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

# Isolate runs by ref: cancel superseded main/PR builds, but never a tag release.
concurrency:
  group: goreleaser-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  goreleaser:
    permissions:
      contents: write
      issues: write
      id-token: write
      attestations: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: |
            go.sum
            tools.mod

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        id: goreleaser
        with:
          distribution: goreleaser
          # This workflow publishes binaries and Debian packages only; container images are handled elsewhere.
          args: ${{ github.ref_type == 'tag' && 'release --clean --skip=docker' || 'release --clean --snapshot --skip=docker' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debian packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sablier-deb-packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      # After GoReleaser runs, attest all the files in ./dist/checksums.txt:
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref_type == 'tag'
        with:
          subject-checksums: ./dist/checksums.txt

      - name: Download latest released Sablier binary
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        id: latest-release
        run: |
          release_data=$(curl -s https://api.github.com/repos/sablierapp/sablier/releases/latest)
          artifact_url=$(echo $release_data | jq -r '.assets[] | select(.name | contains("linux-amd64")) | .browser_download_url')
          version=$(echo $release_data | jq -r '.tag_name')
          wget -q $artifact_url -O sablier_${version}_linux-amd64
          tar -xzf sablier_${version}_linux-amd64
          echo "artifact_path=sablier" >> $GITHUB_OUTPUT

      - name: Compare the downloaded binary with the built binary
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        id: diff
        run: |
          # Extract the built linux/amd64 artifact path from GoReleaser's artifacts.json
          built_path=$(jq -r '.[] | select(.goos=="linux" and .goarch=="amd64") | .path' ./dist/artifacts.json | head -n1)
          if [ -z "$built_path" ]; then
            echo "No linux/amd64 artifact found in ./dist/artifacts.json" >&2
            exit 1
          fi

          GOEXPERIMENT=jsonv2 go tool -modfile=tools.mod gsa -o diff.txt "${{ steps.latest-release.outputs.artifact_path }}" "$built_path"
          echo "diff<<EOF" >> $GITHUB_OUTPUT
          echo "$(cat diff.txt)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment diff on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ```
            ${{ steps.diff.outputs.diff }}
            ```
          comment-tag: go-binary-diff
